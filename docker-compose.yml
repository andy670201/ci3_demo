services:
  web:
    build: .
    container_name: ci3-web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ci3-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci3_fashion
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ci3_db_data:/var/lib/mysql   # 加這行，資料庫資料才不會消失

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ci3-pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  ci3_db_data:    # 宣告 volume，資料持久化